name = "x-tweet-scraper-entitlements"
main = "worker.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# The actor id of the published build. Grants are only issued for runs of this actor,
# which is what stops a fork from obtaining one.
[vars]
PUBLISHED_ACTOR_ID = "bEAaMlZm4LDT5RQuh"

[[kv_namespaces]]
binding = "ENTITLEMENTS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Secrets are set with `wrangler secret put`, never committed:
#   APIFY_SERVICE_TOKEN, ACTOR_SHARED_SECRET, ED25519_PRIVATE_KEY, ADMIN_SECRET
